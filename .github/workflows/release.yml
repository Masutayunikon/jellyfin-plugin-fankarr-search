name: Build & Release

on:
  push:
    tags:
      - "v*.*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install JPRM
        run: pip install jprm

      # Build le DLL d'abord
      - name: Dotnet publish
        run: |
          dotnet publish \
            Jellyfin.Plugin.FanKarrSearch/Jellyfin.Plugin.FanKarrSearch.csproj \
            -c Release \
            -o ./publish

      # JPRM package le DLL en zip Jellyfin-compatible
      - name: Package with JPRM
        run: |
          jprm plugin build \
            --version="${GITHUB_REF_NAME#v}" \
            --output=./artifacts \
            --binary-path=./publish \
            .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update manifest
        run: |
          mkdir -p gh-pages
          if [ ! -f gh-pages/manifest.json ]; then
            jprm repo init gh-pages/
          fi
          jprm repo add \
            --plugin-url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(ls artifacts/*.zip | xargs basename)" \
            gh-pages/ \
            ./artifacts/*.zip

      - name: Push manifest to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest for ${GITHUB_REF_NAME}"
          git push