name: Build & Release

on:
  push:
    tags:
      - "v*.*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Dotnet publish
        run: |
          dotnet publish \
            Jellyfin.Plugin.FanKarrSearch/Jellyfin.Plugin.FanKarrSearch.csproj \
            -c Release \
            -o ./publish

      - name: Package plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p ./artifacts
          cat > ./publish/meta.json << EOF
          {
            "category": "General",
            "guid": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "name": "FanKarr Search",
            "overview": "Intègre FanKarr dans la recherche Jellyfin.",
            "description": "Affiche les résultats FanKarr dans la recherche Jellyfin et permet de faire des demandes en un clic.",
            "owner": "toi",
            "version": "${VERSION}",
            "targetAbi": "10.11.0.0",
            "timestamp": "${TIMESTAMP}"
          }
          EOF
          cd ./publish
          zip -j "../artifacts/Jellyfin.Plugin.FanKarrSearch_${VERSION}.zip" \
            Jellyfin.Plugin.FanKarrSearch.dll \
            meta.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIPNAME="Jellyfin.Plugin.FanKarrSearch_${VERSION}.zip"
          CHECKSUM=$(md5sum ./artifacts/${ZIPNAME} | cut -d' ' -f1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p gh-pages
          cat > gh-pages/manifest.json << EOF
          [
            {
              "category": "General",
              "guid": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "name": "FanKarr Search",
              "overview": "Intègre FanKarr dans la recherche Jellyfin.",
              "description": "Affiche les résultats FanKarr dans la recherche Jellyfin et permet de faire des demandes en un clic.",
              "owner": "toi",
              "versions": [
                {
                  "version": "${VERSION}",
                  "targetAbi": "10.11.8.0",
                  "sourceUrl": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIPNAME}",
                  "checksum": "${CHECKSUM}",
                  "timestamp": "${TIMESTAMP}"
                }
              ]
            }
          ]
          EOF

      - name: Push manifest to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest for ${GITHUB_REF_NAME}"
          git push