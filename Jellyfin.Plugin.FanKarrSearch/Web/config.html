<!DOCTYPE html>
<html>
<head>
  <title>FanKarr</title>
</head>
<body>
  <div id="fankarrConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
      <div class="content-primary">

        <div class="sectionTitleContainer flex align-items-center">
          <h2 class="sectionTitle">FanKarr — Configuration</h2>
        </div>

        <form class="fankarrConfigForm">

          <div class="inputContainer">
            <label class="inputLabel inputLabelUnfocused" for="fankarrApiUrl">
              URL de l'API FanKarr
            </label>
            <input
              id="fankarrApiUrl"
              name="ApiUrl"
              type="url"
              class="emby-input"
              placeholder="https://fankarr.example.com"
              required
            />
            <div class="fieldDescription">
              URL de base de ton API FanKarr, sans slash final.
              Exemple : <code>https://fankarr.tondomaine.com</code>
            </div>
          </div>

          <br />

          <div>
            <button class="raised button-submit block emby-button" type="submit">
              Enregistrer
            </button>
          </div>

        </form>

        <div id="fankarrStatus" style="margin-top:1em;display:none;"></div>

      </div>
    </div>
  </div>

  <script type="text/javascript">
    document.querySelector('#fankarrConfigPage').addEventListener('pageshow', function () {
      ApiClient.getPluginConfiguration('a1b2c3d4-e5f6-7890-abcd-ef1234567890').then(function (config) {
        document.querySelector('#fankarrApiUrl').value = config.ApiUrl || '';
      });
    });

    document.querySelector('.fankarrConfigForm').addEventListener('submit', function (e) {
      e.preventDefault();
      ApiClient.getPluginConfiguration('a1b2c3d4-e5f6-7890-abcd-ef1234567890').then(function (config) {
        config.ApiUrl = document.querySelector('#fankarrApiUrl').value.trim().replace(/\/$/, '');
        ApiClient.updatePluginConfiguration('a1b2c3d4-e5f6-7890-abcd-ef1234567890', config).then(function () {
          var status = document.querySelector('#fankarrStatus');
          status.style.display = 'block';
          status.style.color = 'var(--accent-color, #00a4dc)';
          status.textContent = '✓ Configuration enregistrée. Redémarre le serveur pour appliquer les changements.';
        });
      });
    });
  </script>
</body>
</html>
