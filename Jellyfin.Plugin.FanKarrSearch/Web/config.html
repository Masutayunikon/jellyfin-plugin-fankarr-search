<!DOCTYPE html>
<html>
<head>
  <title>FanKarr Search</title>
</head>
<body>
<div id="fankarrConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
  <div data-role="content">
    <div class="content-primary">

      <div class="sectionTitleContainer">
        <h2 class="sectionTitle">FanKarr Search — Configuration</h2>
      </div>

      <div class="verticalSection">
        <label class="inputLabel" for="fankarrApiUrl">URL de l'API FanKarr</label>
        <input id="fankarrApiUrl" type="url" class="emby-input" placeholder="https://fankarr.example.com" />
        <div class="fieldDescription">
          URL de base sans slash final. Ex : <code>https://fankarr.mondomaine.com</code>
        </div>
      </div>

      <br/>

      <button id="fankarrSave" class="raised button-submit emby-button">Enregistrer</button>
      <div id="fankarrStatus" style="margin-top:1em;color:green;display:none;">✓ Sauvegardé !</div>

    </div>
  </div>
</div>

<script type="text/javascript">
  var pluginId = 'a1b2c3d4-e5f6-7890-abcd-ef1234567890';

  document.querySelector('#fankarrConfigPage').addEventListener('pageshow', function() {
    Dashboard.showLoadingMsg();
    ApiClient.getPluginConfiguration(pluginId).then(function(config) {
      document.querySelector('#fankarrApiUrl').value = config.ApiUrl || '';
      Dashboard.hideLoadingMsg();
    });
  });

  document.querySelector('#fankarrSave').addEventListener('click', function() {
    ApiClient.getPluginConfiguration(pluginId).then(function(config) {
      config.ApiUrl = document.querySelector('#fankarrApiUrl').value.trim().replace(/\/$/, '');
      ApiClient.updatePluginConfiguration(pluginId, config).then(function() {
        var status = document.querySelector('#fankarrStatus');
        status.style.display = 'block';
        setTimeout(function() { status.style.display = 'none'; }, 3000);
      });
    });
  });
</script>
</body>
</html>
