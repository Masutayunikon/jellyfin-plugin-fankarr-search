<!DOCTYPE html>
<html>
<head><title>FanKarr Search</title></head>
<body>
<div id="fankarrConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content">
    <div class="content-primary">
      <h2 class="sectionTitle">FanKarr Search — Configuration</h2>

      <div class="verticalSection">
        <label class="inputLabel" for="fankarrApiUrl">URL de l'API FanKarr</label>
        <input id="fankarrApiUrl" type="url" class="emby-input" placeholder="https://fankarr.example.com" />
        <div class="fieldDescription">Sans slash final. Ex : <code>https://fankarr.mondomaine.com</code></div>
      </div>

      <br/>
      <button id="fankarrSave" class="raised button-submit emby-button" type="button">Enregistrer</button>
      <div id="fankarrStatus" style="margin-top:1em;color:green;display:none;">✓ Sauvegardé !</div>
    </div>
  </div>
</div>

<script type="text/javascript">
  (function() {
    var pluginId = 'a1b2c3d4-e5f6-7890-abcd-ef1234567890';

    function init() {
      var input = document.querySelector('#fankarrApiUrl');
      var btn = document.querySelector('#fankarrSave');
      var status = document.querySelector('#fankarrStatus');

      if (!input || !btn) {
        setTimeout(init, 100);
        return;
      }

      // Charger la config
      ApiClient.getPluginConfiguration(pluginId).then(function(config) {
        input.value = config.ApiUrl || '';
      });

      // Sauvegarder
      btn.onclick = function() {
        var url = input.value.trim().replace(/\/$/, '');
        ApiClient.getPluginConfiguration(pluginId).then(function(config) {
          config.ApiUrl = url;
          ApiClient.updatePluginConfiguration(pluginId, config).then(function() {
            status.style.display = 'block';
            setTimeout(function() { status.style.display = 'none'; }, 3000);
          });
        });
      };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
</body>
</html>
