<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FanKarr Search</title>
</head>
<body>
<div id="FanKarrSearchConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
  <div data-role="content">
    <div class="content-primary">
      <form id="FanKarrSearchConfigForm">

        <div class="inputContainer">
          <label class="inputLabel inputLabelUnfocused" for="ApiUrl">URL de l'API FanKarr</label>
          <input id="ApiUrl" name="ApiUrl" type="url" is="emby-input" placeholder="https://fankarr.example.com" />
          <div class="fieldDescription">Sans slash final. Ex : https://fankarr.mondomaine.com</div>
        </div>

        <div>
          <button is="emby-button" type="submit" class="raised button-submit block emby-button">
            <span>Enregistrer</span>
          </button>
        </div>

      </form>
    </div>
  </div>

  <script type="text/javascript">
    var FanKarrConfig = {
      pluginUniqueId: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
    };

    document.querySelector('#FanKarrSearchConfigPage')
            .addEventListener('pageshow', function() {
              Dashboard.showLoadingMsg();
              ApiClient.getPluginConfiguration(FanKarrConfig.pluginUniqueId).then(function(config) {
                document.querySelector('#ApiUrl').value = config.ApiUrl || '';
                Dashboard.hideLoadingMsg();
              });
            });

    document.querySelector('#FanKarrSearchConfigForm')
            .addEventListener('submit', function(e) {
              e.preventDefault();
              Dashboard.showLoadingMsg();
              ApiClient.getPluginConfiguration(FanKarrConfig.pluginUniqueId).then(function(config) {
                config.ApiUrl = document.querySelector('#ApiUrl').value.trim().replace(/\/$/, '');
                ApiClient.updatePluginConfiguration(FanKarrConfig.pluginUniqueId, config).then(function(result) {
                  Dashboard.processPluginConfigurationUpdateResult(result);
                });
              });
              return false;
            });
  </script>
</div>
</body>
</html>
